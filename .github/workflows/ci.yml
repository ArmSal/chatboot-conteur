name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - name: Déployer sur Render
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
